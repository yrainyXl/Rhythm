<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm C 天色</title>
<style>
:root { --sky: linear-gradient(180deg, #16244A 0%, #2D3D73 36%, #6A5A8E 68%, #C68A7C 100%); --tint: #7FF0DD; }
:root[data-sky="morning"] { --sky: linear-gradient(180deg, #3D86D1 0%, #6FADE6 40%, #A9CFEF 75%, #E8D6BE 100%); --tint: #FFFFFF; }
:root[data-sky="night"] { --sky: linear-gradient(180deg, #03050C 0%, #0B1430 45%, #18224A 100%); --tint: #7FF0DD; }
* { box-sizing: border-box; margin: 0; }
html { background: #16244A; }
body { min-height: 100vh; background: var(--sky); background-attachment: fixed; color: #fff; font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; transition: background .6s; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 120px; text-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.rd { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
.dim { color: rgb(255 255 255 / .62); }

.status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 36px; font-weight: 600; font-size: 16px; }
.status .ic { display: flex; gap: 6px; align-items: center; }
.status svg { fill: currentColor; }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 0 20px; }
.logo { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 17px; }
.logo span { display: inline-flex; gap: 3px; align-items: center; }
.logo i { width: 3px; border-radius: 2px; background: #fff; }
.glass { background: rgb(255 255 255 / .14); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .22); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; }

.hero { text-align: center; padding: 26px 20px 30px; }
.hero .d { font-size: 17px; font-weight: 500; }
.hero .t { font-size: 104px; font-weight: 200; line-height: 1; letter-spacing: -.03em; margin: 8px 0 4px; }
.hero .w { font-size: 22px; font-weight: 500; }
.hero .s { margin-top: 4px; font-size: 17px; }

.panel { margin: 0 16px 12px; border-radius: 22px; padding: 12px 16px 14px; }
.ph { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: rgb(255 255 255 / .62); padding-bottom: 10px; border-bottom: .5px solid rgb(255 255 255 / .22); }
.ph svg { width: 14px; height: 14px; fill: currentColor; }

.hours { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding-top: 12px; }
.hours div { display: grid; gap: 10px; justify-items: center; font-size: 15px; font-weight: 600; }
.hours .now { color: var(--tint); }
.dot { width: 24px; height: 24px; border-radius: 50%; }
.dot.done { background: #fff; }
.dot.part { background: linear-gradient(90deg, #fff 50%, rgb(255 255 255 / .2) 50%); }
.dot.miss { box-shadow: inset 0 0 0 2px rgb(255 255 255 / .4); }
.dot.today { box-shadow: inset 0 0 0 2px var(--tint); }
.dot.next { width: 6px; height: 6px; margin: 9px 0; background: rgb(255 255 255 / .35); }
.hours small { font-size: 13px; font-weight: 500; color: rgb(255 255 255 / .62); }
.btns { display: flex; gap: 8px; margin-top: 14px; }
.btns button { flex: 1; height: 42px; border-radius: 21px; font-size: 15px; font-weight: 600; }
.btns .b1 { background: #fff; color: #1D2A55; text-shadow: none; }

.days { padding-top: 2px; }
.day { display: grid; grid-template-columns: 1fr 34px 110px 34px; align-items: center; gap: 8px; min-height: 50px; font-size: 17px; font-weight: 500; }
.day + .day { border-top: .5px solid rgb(255 255 255 / .22); }
.day .pct { text-align: right; font-size: 15px; }
.range { height: 5px; border-radius: 3px; background: rgb(0 0 0 / .18); position: relative; }
.range i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #8EE9D9, #FFD27A); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 16px 12px; }
.tile { border-radius: 22px; padding: 12px 16px 16px; aspect-ratio: 1; display: flex; flex-direction: column; }
.tile .v { font-size: 34px; font-weight: 500; margin-top: 12px; line-height: 1.1; }
.tile .v small { font-size: 20px; }
.tile p { margin-top: auto; font-size: 14px; }
.note { padding-top: 12px; font-size: 17px; }

.skies { display: flex; justify-content: center; gap: 8px; margin: 20px 0 0; font-size: 13px; }
.skies button { padding: 0 14px; height: 32px; border-radius: 16px; }
.skies button[aria-pressed="true"] { background: rgb(255 255 255 / .3); }

.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); width: min(398px, calc(100% - 24px)); display: flex; gap: 10px; z-index: 10; }
.cap-bar { flex: 1; display: flex; height: 62px; padding: 4px; border-radius: 31px; }
.cap-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; border-radius: 27px; }
.cap-bar a.on { background: rgb(255 255 255 / .2); }
.cap-bar svg, .fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fab { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; }
.tabs .glass { background: rgb(255 255 255 / .18); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .3), 0 10px 30px rgb(0 0 0 / .18); }
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.2a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM3.6 7.2a6.2 6.2 0 0 1 8.8 0l-1.3 1.3a4.4 4.4 0 0 0-6.2 0zM.8 4.4a10.2 10.2 0 0 1 14.4 0l-1.3 1.3a8.4 8.4 0 0 0-11.8 0z"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6"/><rect x="24" y="4" width="1.6" height="4" rx=".8" opacity=".4"/></svg>
  </span></div>

  <div class="nav">
    <a class="logo" href="#"><span aria-hidden="true"><i style="height:9px"></i><i style="height:17px"></i><i style="height:12px"></i></span>Rhythm</a>
    <a class="avatar glass" href="#" aria-label="我的">小</a>
  </div>

  <header class="hero">
    <p class="d">10月13日 星期二 · 今晚</p>
    <p class="t rd">19:30</p>
    <h1 class="w">读 15 分钟</h1>
    <p class="s dim">游戏 21:30 结束 · 早上定的</p>
  </header>

  <section class="panel glass">
    <div class="ph"><svg viewBox="0 0 24 24"><path d="M9 2h6v2h-1v5l5.500 9.500A2 2 0 0 1 17.800 22H6.200a2 2 0 0 1-1.700-3.500L10 9V4H9z"/></svg>让阅读成为日常 · 第 4 天</div>
    <div class="hours">
      <div>一<span class="dot done"></span><small>12分</small></div>
      <div>二<span class="dot part"></span><small>3分</small></div>
      <div>三<span class="dot done"></span><small>8分</small></div>
      <div class="now">今天<span class="dot today"></span><small>待记</small></div>
      <div>五<span class="dot next"></span><small>&nbsp;</small></div>
      <div>六<span class="dot next"></span><small>&nbsp;</small></div>
      <div>日<span class="dot next"></span><small>&nbsp;</small></div>
    </div>
    <div class="btns"><button class="b1">完成了</button><button class="glass">做了一点</button><button class="glass">没开始</button></div>
  </section>

  <section class="panel glass">
    <div class="ph"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>日常习惯 · 近 30 天</div>
    <div class="days">
      <div class="day"><span>读几页书</span><span class="pct dim">57%</span><span class="range"><i style="left:0;right:43%"></i></span><span class="dim">○</span></div>
      <div class="day"><span>喝一杯水</span><span class="pct dim">93%</span><span class="range"><i style="left:0;right:7%"></i></span><span>●</span></div>
    </div>
  </section>

  <div class="tiles">
    <div class="tile glass"><div class="ph" style="border:0;padding:0">昨晚睡眠</div><div class="v rd">7<small>时</small>12<small>分</small></div><p>比平时多睡了 20 分钟</p></div>
    <div class="tile glass"><div class="ph" style="border:0;padding:0">原子习惯</div><div class="v rd">27<small>%</small></div><p>这周读了 46 分钟</p></div>
  </div>

  <section class="panel glass">
    <div class="ph">想法 · 18:42</div>
    <p class="note">下班路上又想打游戏，但今天先吃了饭。</p>
  </section>

  <div class="skies" role="group" aria-label="预览天色">
    <button class="glass" data-s="morning" aria-pressed="false">早晨</button>
    <button class="glass" data-s="dusk" aria-pressed="true">傍晚</button>
    <button class="glass" data-s="night" aria-pressed="false">深夜</button>
  </div>
</div>

<nav class="tabs" aria-label="主要导航">
  <div class="cap-bar glass">
    <a class="on" href="#" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>今天</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>计划</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M5 20V13M10 20V8M15 20v-9M20 20V4"/></svg>记录</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 5.5C6 4 9 4.3 12 6c3-1.7 6-2 9-.5V19.5c-3-1.2-6-1-9 .5-3-1.5-6-1.7-9-.5z"/><path d="M12 6v14"/></svg>阅读</a>
  </div>
  <button class="fab glass" aria-label="记一句"><svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
</nav>
<script>
document.querySelectorAll('.skies button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.documentElement.dataset.sky = b.dataset.s;
    document.querySelectorAll('.skies button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
  });
});
</script>
</body>
</html>

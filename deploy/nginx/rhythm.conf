# Rhythm 反代配置(宿主机 nginx)
# 说明:
#   - limit_req_zone 需放在 http 层(/etc/nginx/nginx.conf 内),此处以注释给出,location 引用它。
#   - certbot --nginx -d your.domain.com --redirect 会注入 443 块与证书路径。

# http 层(放 /etc/nginx/nginx.conf 的 http {} 内):
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name your.domain.com;

    # 登录接口单独限流(暴力破解第一道防线)
    location = /api/auth/signin {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;   # 与 next serverActions bodySizeLimit 对齐
    }
}

# 443 块(certbot 注入)追加安全头:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# add_header X-Content-Type-Options nosniff always;
# add_header X-Frame-Options DENY always;
# add_header Referrer-Policy strict-origin-when-cross-origin always;

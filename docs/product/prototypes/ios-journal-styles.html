<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythm 日记流变体</title>
<style>
:root { --bg: #E9E9EE; --ink: #1C1C1E; --ink-2: #6C6C70; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, "PingFang SC", sans-serif; padding: 32px 16px 48px; }
h1 { font-size: 28px; font-weight: 700; text-align: center; }
.sub { text-align: center; color: var(--ink-2); margin-top: 6px; font-size: 15px; }
.grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 28px; margin-top: 32px; }
figure { width: 410px; max-width: 100%; }
.phone { width: 410px; height: 864px; max-width: 100%; border-radius: 52px; overflow: hidden; border: 10px solid #111; background: #111; box-shadow: 0 20px 50px rgb(0 0 0 / .18); }
iframe { width: 100%; height: 100%; border: 0; display: block; border-radius: 42px; }
figcaption { margin-top: 14px; padding: 0 6px; }
figcaption b { font-size: 17px; }
figcaption p { margin-top: 4px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
figcaption a { font-size: 14px; color: #5E5CE6; }
</style>
</head>
<body>
<h1>Rhythm · 日记流的 4 个变体</h1>
<p class="sub">同一天的内容，按时间组织的 4 种方式。</p>
<div class="grid">
  <figure><div class="phone"><iframe src="ios-d-journal.html" title="D 日记流"></iframe></div>
    <figcaption><b>D 日记流（原版）</b><p>顶部是记录提示卡片，下面按时间倒序排列卡片，打卡和想法混在一起。</p><a href="ios-d-journal.html">单独打开</a></figcaption></figure>
  <figure><div class="phone"><iframe src="ios-d2-timeline.html" title="D2 时间轴"></iframe></div>
    <figcaption><b>D2 时间轴</b><p>参照「日历」的日视图：顶部选一周里的哪天，一条竖线贯穿全天，「现在」是一条横线；上面是还没到的安排（虚线），下面是已经发生的事。</p><a href="ios-d2-timeline.html">单独打开</a></figcaption></figure>
  <figure><div class="phone"><iframe src="ios-d3-chat.html" title="D3 自言自语"></iframe></div>
    <figcaption><b>D3 自言自语</b><p>参照「信息」App：一天就是和 Rhythm 的一段对话。它在合适的时间提问，你直接回复或发语音；打卡变成快捷回复，发现规律时它会主动说一句。</p><a href="ios-d3-chat.html">单独打开</a></figcaption></figure>
  <figure><div class="phone"><iframe src="ios-d4-night.html" title="D4 夜间回看"></iframe></div>
    <figcaption><b>D4 夜间回看</b><p>深色版日记流，加了「连续记录」「这周发现」和「上周的今天」，让你一打开就能看到自己的变化，也能把发现直接记成方法。</p><a href="ios-d4-night.html">单独打开</a></figcaption></figure>
</div>
</body>
</html>

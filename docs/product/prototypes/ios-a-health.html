<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm A 健康摘要</title>
<style>
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --label: #000000; --label-2: #8A8A8E; --sep: #E3E3E8;
  --tint: #0C9483; --habit: #FF9500; --tonight: #5856D6; --idea: #E6B800; --read: #AF52DE;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--label); font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 120px; }

.status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 36px; font-weight: 600; font-size: 16px; }
.status .ic { display: flex; gap: 6px; align-items: center; }
.status svg { fill: currentColor; }

.nav { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 0 20px; }
.logo { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 17px; }
.logo span { display: inline-flex; gap: 3px; align-items: center; }
.logo i { width: 3px; border-radius: 2px; background: var(--tint); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(#A6A6AD, #85858C); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 600; }

.title { padding: 14px 20px 6px; }
.title p { font-size: 13px; font-weight: 600; color: var(--label-2); }
.title h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }

.sec { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 20px 8px; }
.sec h2 { font-size: 22px; font-weight: 700; }
.sec a { font-size: 17px; color: var(--tint); }

.card { background: var(--card); border-radius: 14px; margin: 0 16px 10px; padding: 13px 16px 16px; }
.ch { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--c); }
.ch svg { width: 18px; height: 18px; }
.ch .meta { margin-left: auto; color: var(--label-2); font-weight: 400; display: flex; align-items: center; gap: 4px; }
.ch .meta::after { content: ""; width: 7px; height: 7px; border-right: 2px solid #C4C4C7; border-top: 2px solid #C4C4C7; transform: rotate(45deg); }

.p-title { margin-top: 10px; font-size: 17px; font-weight: 600; }
.p-row { margin-top: 8px; display: flex; justify-content: space-between; align-items: flex-end; }
.big { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; font-size: 34px; font-weight: 700; line-height: 1; }
.big small { font-size: 17px; color: var(--label-2); font-weight: 600; margin-left: 2px; }
.cap { margin-top: 4px; font-size: 13px; color: var(--label-2); }
.chart { display: grid; grid-template-columns: repeat(7, 14px); gap: 6px; align-items: end; }
.chart i { display: block; border-radius: 3px; background: #E5E5EA; height: 4px; }
.chart i.d { background: var(--tint); height: 40px; }
.chart i.p { background: var(--habit); height: 22px; }
.chart i.t { height: 40px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--tint); }
.chart span { font-size: 10px; color: var(--label-2); text-align: center; }
.log { margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--sep); }
.log p { font-size: 15px; color: var(--label-2); margin-bottom: 10px; }
.btns { display: flex; gap: 8px; }
.btns button { flex: 1; height: 40px; border-radius: 20px; font-size: 15px; font-weight: 600; }
.b1 { background: rgb(12 148 131 / .14); color: var(--tint); }
.b2 { background: rgb(255 149 0 / .15); color: #C26E00; }
.b3 { background: #EFEFF4; color: #3C3C43; }

.slot { display: flex; align-items: baseline; gap: 14px; margin-top: 10px; }
.slot b { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; font-size: 22px; font-weight: 600; width: 64px; }
.slot span { font-size: 17px; }
.slot em { font-style: normal; color: var(--label-2); font-size: 15px; }

.rows { margin-top: 4px; }
.r { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.r + .r .rn { border-top: .5px solid var(--sep); }
.rn { flex: 1; display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.rn em { font-style: normal; font-size: 15px; color: var(--label-2); }
.circle { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #C7C7CC; flex: none; display: grid; place-items: center; }
.r.done .circle { background: var(--habit); border-color: var(--habit); }
.r.done .circle::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); }
.r.done .rn > span { color: var(--label-2); }

.note { margin-top: 10px; font-size: 17px; }
.quote { margin-top: 10px; font-family: "New York", ui-serif, "Songti SC", serif; font-size: 19px; line-height: 1.5; }
.src { margin-top: 8px; font-size: 13px; color: var(--label-2); }

.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); width: min(398px, calc(100% - 24px)); display: flex; gap: 10px; z-index: 10; }
.cap-bar { flex: 1; display: flex; height: 62px; padding: 4px; border-radius: 31px; background: rgb(255 255 255 / .72); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); box-shadow: 0 0 0 .5px rgb(0 0 0 / .08), 0 10px 30px rgb(0 0 0 / .12); }
.cap-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; border-radius: 27px; color: #1C1C1E; }
.cap-bar a.on { background: rgb(0 0 0 / .06); color: var(--tint); }
.cap-bar svg, .fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fab { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--tint); background: rgb(255 255 255 / .72); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); box-shadow: 0 0 0 .5px rgb(0 0 0 / .08), 0 10px 30px rgb(0 0 0 / .12); }
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.2a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM3.6 7.2a6.2 6.2 0 0 1 8.8 0l-1.3 1.3a4.4 4.4 0 0 0-6.2 0zM.8 4.4a10.200 10.200 0 0 1 14.400 0l-1.300 1.300a8.400 8.400 0 0 0-11.800 0z"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.600"/><rect x="24" y="4" width="1.600" height="4" rx=".800" opacity=".4"/></svg>
  </span></div>

  <div class="nav">
    <a class="logo" href="#"><span aria-hidden="true"><i style="height:9px"></i><i style="height:17px"></i><i style="height:12px"></i></span>Rhythm</a>
    <a class="avatar" href="#" aria-label="我的">小</a>
  </div>

  <header class="title"><p>10月13日 星期二</p><h1>今天</h1></header>

  <div class="sec"><h2>置顶</h2><a href="#">编辑</a></div>

  <article class="card" style="--c: var(--tint)">
    <div class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.700 3h10.600a2 2 0 0 0 1.700-3l-5-9V3"/><path d="M7.500 15h9"/></svg>实践<span class="meta">第 4 天</span></div>
    <h3 class="p-title">让阅读成为日常</h3>
    <div class="p-row">
      <div><div class="big">2<small>天完成</small></div><p class="cap">本轮 7 天，另有 1 天做了一点</p></div>
      <div class="chart" aria-label="本轮完成情况">
        <i class="d"></i><i class="p"></i><i class="d"></i><i class="t"></i><i></i><i></i><i></i>
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
    </div>
    <div class="log"><p>今天读了吗？</p><div class="btns"><button class="b1">完成了</button><button class="b2">做了一点</button><button class="b3">没开始</button></div></div>
  </article>

  <article class="card" style="--c: var(--tonight)">
    <div class="ch"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.500A8.500 8.500 0 0 1 9.500 4a8.500 8.500 0 1 0 10.500 10.500z"/></svg>今晚<span class="meta">早上定的</span></div>
    <div class="slot"><b>19:30</b><span>读 15 分钟</span></div>
    <div class="slot"><b>21:30</b><span>游戏结束</span><em>给自己留的休息</em></div>
  </article>

  <article class="card" style="--c: var(--habit)">
    <div class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M4 12l4 4L20 6"/></svg>日常习惯<span class="meta">1 / 2</span></div>
    <div class="rows">
      <div class="r"><span class="circle"></span><div class="rn"><span>读几页书</span><em>连续 3 天</em></div></div>
      <div class="r done"><span class="circle"></span><div class="rn"><span>喝一杯水</span><em>12:30</em></div></div>
    </div>
  </article>

  <article class="card" style="--c: var(--idea)">
    <div class="ch"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.700V17h8v-2.300A7 7 0 0 0 12 2zM9 19h6v1.500a1.500 1.500 0 0 1-1.500 1.500h-3A1.500 1.500 0 0 1 9 20.500z"/></svg>想法<span class="meta">18:42</span></div>
    <p class="note">下班路上又想打游戏，但今天先吃了饭。</p>
  </article>

  <div class="sec"><h2>阅读</h2><a href="#">全部划线</a></div>
  <article class="card" style="--c: var(--read)">
    <div class="ch"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.500C6 4 9 4.300 11.300 6v14C9 18.500 6 18.300 3 19.500zM21 5.500C18 4 15 4.300 12.700 6v14c2.300-1.500 5.300-1.700 8.300-.500z"/></svg>重读一句<span class="meta">换一句</span></div>
    <p class="quote">你不需要每天都做到完美，重要的是让开始变得容易。</p>
    <p class="src">《原子习惯》 詹姆斯·克利尔</p>
  </article>
</div>

<nav class="tabs" aria-label="主要导航">
  <div class="cap-bar">
    <a class="on" href="#" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15.500" rx="3.500"/><path d="M8 3v4M16 3v4M3.500 10h17"/></svg>今天</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><circle cx="12" cy="12" r="4.500"/><circle cx="12" cy="12" r=".800" fill="currentColor"/></svg>计划</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M5 20V13M10 20V8M15 20v-9M20 20V4"/></svg>记录</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 5.500C6 4 9 4.300 12 6c3-1.700 6-2 9-.500V19.500c-3-1.200-6-1-9 .500-3-1.500-6-1.700-9-.500z"/><path d="M12 6v14"/></svg>阅读</a>
  </div>
  <button class="fab" aria-label="记一句"><svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.500 3.500a2.100 2.100 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
</nav>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm B 节奏圆环</title>
<style>
:root {
  --bg: #000000; --card: #1C1C1E; --card-2: #2C2C2E; --label: #FFFFFF; --label-2: #98989F; --sep: #38383A;
  --practice: #2EE6C9; --habit: #FF9F0A; --idea: #BF5AF2; --tint: #2EE6C9;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--label); font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 120px; }
.rd { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }

.status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 36px; font-weight: 600; font-size: 16px; }
.status .ic { display: flex; gap: 6px; align-items: center; }
.status svg { fill: currentColor; }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 0 20px; }
.logo { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 17px; }
.logo span { display: inline-flex; gap: 3px; align-items: center; }
.logo i { width: 3px; border-radius: 2px; background: var(--practice); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-size: 15px; font-weight: 600; }

.title { padding: 14px 20px 14px; }
.title p { font-size: 13px; font-weight: 600; color: var(--label-2); }
.title h1 { font-size: 34px; font-weight: 700; line-height: 1.2; }

.card { background: var(--card); border-radius: 18px; margin: 0 16px 12px; padding: 16px; }
.card h2 { font-size: 17px; font-weight: 600; }

.hero { display: flex; align-items: center; gap: 18px; }
.rings { width: 150px; height: 150px; flex: none; transform: rotate(-90deg); }
.rings circle { fill: none; stroke-width: 15; stroke-linecap: round; }
.stats { display: grid; gap: 10px; }
.stats dt { font-size: 15px; font-weight: 600; }
.stats dd { font-size: 24px; font-weight: 700; line-height: 1.1; }
.stats dd small { font-size: 15px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 18px; padding-top: 14px; border-top: .5px solid var(--sep); text-align: center; }
.week span { font-size: 12px; font-weight: 600; color: var(--label-2); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 6px; }
.week span.now { background: var(--label); color: #000; }
.week svg { width: 30px; height: 30px; display: block; margin: 0 auto; transform: rotate(-90deg); }
.week circle { fill: none; stroke-width: 4.500; stroke-linecap: round; }

.tonight { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
.tonight .t { font-size: 54px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.tonight p { font-size: 15px; color: var(--label-2); margin-top: 6px; }
.tonight .end { text-align: right; }
.tonight .end b { font-size: 24px; color: var(--habit); display: block; }
.tonight .end span { font-size: 13px; color: var(--label-2); }

.q { margin-top: 4px; font-size: 15px; color: var(--label-2); }
.btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.btns button { height: 50px; border-radius: 25px; font-size: 16px; font-weight: 600; }
.b1 { background: var(--practice); color: #00201B; }
.b2 { background: rgb(255 159 10 / .2); color: var(--habit); }
.b3 { background: var(--card-2); color: var(--label); }

.r { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.r + .r { border-top: .5px solid var(--sep); }
.r svg { width: 28px; height: 28px; transform: rotate(-90deg); flex: none; }
.r svg circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.r .n { flex: 1; }
.r em { font-style: normal; color: var(--label-2); font-size: 15px; }
.r b { font-weight: 700; color: var(--habit); font-size: 17px; }

.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); width: min(398px, calc(100% - 24px)); display: flex; gap: 10px; z-index: 10; }
.cap-bar, .fab { background: rgb(40 40 42 / .72); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .12), 0 10px 30px rgb(0 0 0 / .5); }
.cap-bar { flex: 1; display: flex; height: 62px; padding: 4px; border-radius: 31px; }
.cap-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; border-radius: 27px; color: #E5E5EA; }
.cap-bar a.on { background: rgb(255 255 255 / .1); color: var(--tint); }
.cap-bar svg, .fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fab { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--tint); }
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.2a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM3.6 7.2a6.2 6.2 0 0 1 8.8 0l-1.3 1.3a4.4 4.4 0 0 0-6.2 0zM.8 4.4a10.2 10.2 0 0 1 14.4 0l-1.3 1.3a8.4 8.4 0 0 0-11.8 0z"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6"/><rect x="24" y="4" width="1.6" height="4" rx=".8" opacity=".4"/></svg>
  </span></div>

  <div class="nav">
    <a class="logo" href="#"><span aria-hidden="true"><i style="height:9px"></i><i style="height:17px"></i><i style="height:12px"></i></span>Rhythm</a>
    <a class="avatar" href="#" aria-label="我的">小</a>
  </div>

  <header class="title"><p>10月13日 星期二</p><h1>今天</h1></header>

  <!-- 圆周长：r=64 → 402；r=46 → 289；r=28 → 176 -->
  <section class="card">
    <div class="hero">
      <svg class="rings" viewBox="0 0 150 150" aria-hidden="true">
        <circle cx="75" cy="75" r="64" stroke="rgb(46 230 201 / .22)"/>
        <circle cx="75" cy="75" r="64" stroke="var(--practice)" stroke-dasharray="172 402"/>
        <circle cx="75" cy="75" r="46" stroke="rgb(255 159 10 / .22)"/>
        <circle cx="75" cy="75" r="46" stroke="var(--habit)" stroke-dasharray="145 289"/>
        <circle cx="75" cy="75" r="28" stroke="rgb(191 90 242 / .22)"/>
        <circle cx="75" cy="75" r="28" stroke="var(--idea)" stroke-dasharray="132 176"/>
      </svg>
      <dl class="stats">
        <div><dt>实践</dt><dd class="rd" style="color:var(--practice)">3/7<small> 天</small></dd></div>
        <div><dt>习惯</dt><dd class="rd" style="color:var(--habit)">1/2<small> 项</small></dd></div>
        <div><dt>想法</dt><dd class="rd" style="color:var(--idea)">3<small> 条</small></dd></div>
      </dl>
    </div>
    <div class="week" aria-label="本周每天">
      <div><span>一</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="rgb(46 230 201 / .22)"/><circle cx="15" cy="15" r="11" stroke="var(--practice)" stroke-dasharray="69 69"/></svg></div>
      <div><span>二</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="rgb(46 230 201 / .22)"/><circle cx="15" cy="15" r="11" stroke="var(--practice)" stroke-dasharray="34 69"/></svg></div>
      <div><span>三</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="rgb(46 230 201 / .22)"/><circle cx="15" cy="15" r="11" stroke="var(--practice)" stroke-dasharray="69 69"/></svg></div>
      <div><span class="now">四</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="rgb(46 230 201 / .22)"/></svg></div>
      <div><span>五</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="#2C2C2E"/></svg></div>
      <div><span>六</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="#2C2C2E"/></svg></div>
      <div><span>日</span><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="#2C2C2E"/></svg></div>
    </div>
  </section>

  <section class="card">
    <h2>今晚</h2>
    <div class="tonight">
      <div><div class="t rd">19:30</div><p>开始读 15 分钟</p></div>
      <div class="end"><b class="rd">21:30</b><span>游戏结束</span></div>
    </div>
  </section>

  <section class="card">
    <h2>让阅读成为日常</h2>
    <p class="q">第 4 天，今天读了吗？</p>
    <div class="btns"><button class="b1">完成了</button><button class="b2">做了一点</button><button class="b3">没开始</button></div>
  </section>

  <section class="card">
    <h2>日常习惯</h2>
    <div class="r"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" stroke="rgb(255 159 10 / .22)"/></svg><span class="n">读几页书</span><em>连续 3 天</em></div>
    <div class="r"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" stroke="var(--habit)"/></svg><span class="n">喝一杯水</span><b class="rd">✓</b></div>
  </section>
</div>

<nav class="tabs" aria-label="主要导航">
  <div class="cap-bar">
    <a class="on" href="#" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>今天</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>计划</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M5 20V13M10 20V8M15 20v-9M20 20V4"/></svg>记录</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 5.5C6 4 9 4.3 12 6c3-1.7 6-2 9-.5V19.5c-3-1.2-6-1-9 .5-3-1.5-6-1.7-9-.5z"/><path d="M12 6v14"/></svg>阅读</a>
  </div>
  <button class="fab" aria-label="记一句"><svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
</nav>
</body>
</html>

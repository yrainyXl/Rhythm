name: Deploy Rhythm

on:
  push:
    branches:
      - main

concurrency:
  group: rhythm-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare offline Git bundle
        run: git bundle create rhythm-deploy.bundle HEAD refs/heads/main
      - name: Upload release bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          source: rhythm-deploy.bundle
          target: /tmp/rhythm-deploy
          overwrite: true
      - name: Deploy to Tencent Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          script: |
            set -e

            cd /opt/apps/Rhythm

            git fetch /tmp/rhythm-deploy/rhythm-deploy.bundle refs/heads/main
            git merge --ff-only FETCH_HEAD
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            docker compose up -d --build --wait --wait-timeout 120

            docker compose ps

            docker image prune -f
            rm /tmp/rhythm-deploy/rhythm-deploy.bundle

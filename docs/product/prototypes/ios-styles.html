<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythm iOS 风格对比</title>
<style>
:root { --bg: #E9E9EE; --ink: #1C1C1E; --ink-2: #6C6C70; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, "PingFang SC", sans-serif; padding: 32px 16px 48px; }
h1 { font-size: 28px; font-weight: 700; text-align: center; }
.sub { text-align: center; color: var(--ink-2); margin-top: 6px; font-size: 15px; }
.grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 28px; margin-top: 32px; }
figure { width: 410px; max-width: 100%; }
.phone { width: 410px; height: 864px; max-width: 100%; border-radius: 52px; overflow: hidden; border: 10px solid #111; background: #111; box-shadow: 0 20px 50px rgb(0 0 0 / .18); }
iframe { width: 100%; height: 100%; border: 0; display: block; border-radius: 42px; }
figcaption { margin-top: 14px; padding: 0 6px; }
figcaption b { font-size: 17px; }
figcaption p { margin-top: 4px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
figcaption a { font-size: 14px; color: #0C9483; }
</style>
</head>
<body>
<h1>Rhythm · 今天页 4 种 iOS 风格</h1>
<p class="sub">同一份内容，四种不同骨架。每台手机都可以单独滚动和点击。</p>
<div class="grid">
  <figure><div class="phone"><iframe src="ios-a-health.html" title="A 健康摘要"></iframe></div>
    <figcaption><b>A 健康摘要</b><p>参照「健康」App：分组卡片，每类内容有自己的颜色和图标，信息密度高，最像系统原生。</p><a href="ios-a-health.html">单独打开</a></figcaption></figure>
  <figure><div class="phone"><iframe src="ios-b-rings.html" title="B 节奏圆环"></iframe></div>
    <figcaption><b>B 节奏圆环</b><p>参照「健身」App：纯黑底，实践、习惯、想法三个圆环，每天一个小圆环，用大号圆体数字表达进度。</p><a href="ios-b-rings.html">单独打开</a></figcaption></figure>
  <figure><div class="phone"><iframe src="ios-c-sky.html" title="C 天色"></iframe></div>
    <figcaption><b>C 天色</b><p>参照「天气」App 和 Liquid Glass：背景随时间变化，「今晚 19:30」是主角，实践写成逐日预报。底部可切换天色。</p><a href="ios-c-sky.html">单独打开</a></figcaption></figure>
  <figure><div class="phone"><iframe src="ios-d-journal.html" title="D 日记流"></iframe></div>
    <figcaption><b>D 日记流</b><p>参照「日记」App：顶部是记录提示，下面按时间倒序排列今天发生的事，打卡和想法混在同一条时间线里。</p><a href="ios-d-journal.html">单独打开</a></figcaption></figure>
</div>
</body>
</html>
